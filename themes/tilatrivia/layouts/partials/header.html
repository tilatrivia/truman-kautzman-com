<header class="bg-green">
    <div class="tk-container py-8 flex flex-col lg:flex-row justify-between gap-4">
        <!-- Large Screens -->
        <a class="fade-hover hidden md:block" href="{{ .Site.BaseURL }}">
            <object height="60" type="image/svg+xml" data="/truman-kautzman-text-logo-fades.svg" class="pointer-events-none"></object>
        </a>

        <!-- Small Screens -->
        <a class="block md:hidden" href="{{ .Site.BaseURL }}">
            <object height="106" type="image/svg+xml" data="/truman-kautzman-text-logo-wrapped.svg" class="pointer-events-none"></object>
        </a>

        <ul class="tk-buttons">
            {{ range.Site.Menus.main }}
            <li>
                <a class="tk-button tk-button-blue text-light" href="{{ .URL }}">{{ .Name }}</a>
            </li>
            {{ end }}
        </ul>
    </div>
</header>
