<header class="bg-green sticky top-0 z-[102]">
    <div class="tk-container py-4 flex flex-row justify-between">
        <!-- Large Screens -->
        <a class="tk-fade-hover hidden md:block" href="{{ .Site.BaseURL }}">
            <object height="68" type="image/svg+xml" data="/images/truman-kautzman-text-logo-fades.svg" class="pointer-events-none" tabindex="-1"></object>
        </a>

        <!-- Small Screens -->
        <a class="block md:hidden pl-2" href="{{ .Site.BaseURL }}">
            <object height="72" type="image/svg+xml" data="/images/truman-kautzman-text-logo-wrapped.svg" class="pointer-events-none" tabindex="-1"></object>
        </a>

        <button id="tk-nav-toggle" class="w-min">
            <div class="tk-fade-hover pointer-events-none md:pointer-events-auto">
                <object height="52" type="image/svg+xml" data="/images/nav-menu-fade.svg" class="pointer-events-none" tabindex="-1"></object>
            </div>
        </button>
    </div>

    <!-- Nav -->
    <div id="tk-nav" class="absolute overflow-hidden bg-green top-full left-0 w-full transition-[height] duration-100 ease-out h-0">
        <div id="tk-nav-content" class="tk-container py-4">
            <nav class="tk-buttons grid grid-cols-1 lg:grid-cols-3">
                <!-- About -->
                <a class="tk-nav-focus block" href="/about">
                    <div class="tk-fade-hover pointer-events-none md:pointer-events-auto block w-min">
                        <object height="52" type="image/svg+xml" data="/images/nav-about-fade.svg" class="pointer-events-none" tabindex="-1"></object>
                    </div>
                    <p class="text-light p-3">
                        The skills, qualifications, and experiences that enable me to solve complex problems.
                    </p>
                </a>

                <!-- Projects -->
                <a class="tk-nav-focus block" href="/projects">
                    <div class="tk-fade-hover pointer-events-none md:pointer-events-auto block w-min">
                        <object height="52" type="image/svg+xml" data="/images/nav-projects-fade.svg" class="pointer-events-none" tabindex="-1"></object>
                    </div>
                    <p class="text-light p-3">
                        A collection of projects that demonstrate my hard work and problem solving skills.
                    </p>
                </a>

                <!-- Articles -->
                <a class="tk-nav-focus block" href="/articles">
                    <div class="tk-fade-hover pointer-events-none md:pointer-events-auto block w-min">
                        <object height="52" type="image/svg+xml" data="/images/nav-articles-fade.svg" class="pointer-events-none" tabindex="-1"></object>
                    </div>
                    <p class="text-light p-3">
                        My thoughts on software, technology, design, and all sorts of other things.
                    </p>
                </a>
            </nav>
        </div>
    </div>
</header>

<div id="tk-nav-overlay" class="fixed inset-0 bg-black/0 z-[101] transition-[background-color] ease-out duration-100"></div>
